# SHAT release pipeline (spec §18.3/§18.4).
#
# Triggers only on v* tags. Each image is built once and published under an
# immutable tag derived from the git SHA (sha-<commit>); no mutable "latest".
# The registry defaults to GHCR and authenticates with the short-lived
# GITHUB_TOKEN (no long-lived cloud secret). OIDC federation can be added if a
# cloud deploy target is introduced. Operators may override the registry
# namespace with the repository variable SHAT_REGISTRY; a non-GHCR registry also
# requires changing the login step. Build provenance is attested
# with a standard pinned action; vulnerability scanning is not wired here
# because no standard scanner action was verified/pinned in this environment.
#
# Hardening: top-level permissions are none and each job declares only what it
# needs; every third-party action is pinned to a full commit SHA; the release
# path uses no cache; no secret is printed and untrusted ref names are passed
# through env rather than interpolated into shell.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build-and-push:
    name: Build, push and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      SHAT_REGISTRY: ${{ vars.SHAT_REGISTRY || format('ghcr.io/{0}/', github.repository_owner) }}
      SHAT_IMAGE_TAG: sha-${{ github.sha }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:31004' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@5176d81f87c23d6fc96624dfdbcd9f3830bbe445 # v6.5.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64
          no-cache: true
          tags: ${{ env.SHAT_REGISTRY }}shat-backend:${{ env.SHAT_IMAGE_TAG }}

      - name: Build and push web
        id: web
        uses: docker/build-push-action@5176d81f87c23d6fc96624dfdbcd9f3830bbe445 # v6.5.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          target: runtime
          push: true
          platforms: linux/amd64
          no-cache: true
          build-args: VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: ${{ env.SHAT_REGISTRY }}shat-web:${{ env.SHAT_IMAGE_TAG }}

      - name: Build and push dashboard
        id: dashboard
        uses: docker/build-push-action@5176d81f87c23d6fc96624dfdbcd9f3830bbe445 # v6.5.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.dashboard
          target: runtime
          push: true
          platforms: linux/amd64
          no-cache: true
          build-args: VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: ${{ env.SHAT_REGISTRY }}shat-dashboard:${{ env.SHAT_IMAGE_TAG }}

      - name: Attest backend provenance
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ${{ env.SHAT_REGISTRY }}shat-backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

      - name: Attest web provenance
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ${{ env.SHAT_REGISTRY }}shat-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Attest dashboard provenance
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ${{ env.SHAT_REGISTRY }}shat-dashboard
          subject-digest: ${{ steps.dashboard.outputs.digest }}
          push-to-registry: true

  staging-smoke:
    name: Smoke-check released image in staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      SHAT_REGISTRY: ${{ vars.SHAT_REGISTRY || format('ghcr.io/{0}/', github.repository_owner) }}
      SHAT_IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Log in to registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start production-Compose stack in staging
        env:
          POSTGRES_PASSWORD: smoke-only-not-a-secret
          SHAT_ENROLLMENT_TOKEN: smoke-only-enrollment-token-not-a-secret
          TURN_SECRET: smoke-only-turn-secret-with-more-than-32-chars
          SHAT_ADMIN_TOKEN: smoke-only-admin-token-with-more-than-32-chars
        run: docker compose -f infrastructure/docker/compose.production.yaml up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:31004/health || true)
            if [ "$code" = "200" ]; then
              echo "health endpoint returned 200"
              exit 0
            fi
            sleep 2
          done
          echo "health endpoint did not return 200 in time"
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose -f infrastructure/docker/compose.production.yaml down -v

  production:
    name: Production approval and record
    needs: staging-smoke
    runs-on: ubuntu-latest
    # Required reviewers are configured on the "production" environment in
    # repository settings; this job is an approval gate, not a claim that a
    # remote host was deployed to by CI (no OIDC host target is configured).
    environment: production
    permissions:
      contents: read
    env:
      RELEASE_REF: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Record deploy and rollback commands
        run: |
          echo "Release $RELEASE_REF (sha-$RELEASE_SHA) approved for production." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: SHAT_IMAGE_TAG=sha-$RELEASE_SHA docker compose -f infrastructure/docker/compose.production.yaml up -d" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: redeploy the previous immutable tag; there is no automatic database rollback (see docs/operations.md)." >> "$GITHUB_STEP_SUMMARY"
