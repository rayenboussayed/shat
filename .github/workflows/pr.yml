# SHAT continuous integration (spec §18.3/§18.4).
#
# Triggers on pull requests, every push to main, and manual dispatch, so direct
# pushes to main are still verified and a run can be started from the Actions tab.
#
# Scope: repository code only. Native mobile builds are intentionally NOT run:
# this repo has no macOS runner, Android SDK or signing credentials, so a
# "green" native build here would be false. EAS builds remain manual (see
# docs/operations.md and apps/mobile/README.md).
#
# Hardening: pull_request (not pull_request_target) so fork code runs without
# secrets; top-level read-only permissions; every third-party action pinned to a
# full commit SHA; no cache (setup-node cache keys are shared across refs, so a
# fork PR could poison a default-branch build); no secrets interpolated into
# shell; checkout does not persist the token because nothing pushes back.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same ref so a push to main does not leave an
# older verification job competing with the new one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, build and validate
    runs-on: ubuntu-latest
    # Bounds a hung test, benchmark or Compose pull instead of burning 6 hours.
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://shat:shat@localhost:5432/shat
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_USER: shat
          POSTGRES_PASSWORD: shat
          POSTGRES_DB: shat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shat -d shat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 5s
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 26.13.1
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '26.13.1'
          # No cache: see the hardening note at the top of this file.

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      # check runs vitest across all projects, including e2e which spawns the
      # compiled backend. dist is gitignored, so build before check.
      - name: Build all workspaces
        run: npm run build

      - name: Check (typecheck, lint, knip, tests)
        run: npm run check

      - name: Unit tests
        run: npm run test-unit

      - name: Integration tests (PostgreSQL service)
        run: npm run test-integration

      - name: End-to-end tests
        run: npm run test-e2e

      - name: Coverage
        run: npm run test-cov -- --coverage.reporter=text --coverage.reporter=json-summary

      - name: Performance benchmarks
        run: npm run test-perf

      - name: Memory tests
        run: npm run test-mem

      # Required gate: regenerates the OpenAPI contract and fails on any drift.
      - name: API contract drift check
        run: npm run gen:api:check

      # Production Compose deliberately requires SHAT_IMAGE_TAG (no stale
      # default), so provide a throwaway tag for syntax/config validation only.
      - name: Validate Compose files
        env:
          SHAT_IMAGE_TAG: sha-config-validation-only
        run: |
          docker compose -f infrastructure/docker/compose.development.yaml config >/dev/null
          docker compose -f infrastructure/docker/compose.production.yaml config >/dev/null
