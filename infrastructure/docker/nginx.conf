# Static SPA server for the built web and dashboard bundles.
# Runs as uid 101:101, so pid and all scratch paths live under /tmp/nginx.
worker_processes auto;
pid /tmp/nginx/nginx.pid;

events {
  worker_connections 1024;
}

# uid 101 cannot write root-owned /var/log/nginx; stream logs to the runtime.
error_log /dev/stderr warn;

http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app's <meta> CSP cannot enforce frame-ancestors, so send a real HTTP
    # header. style-src 'self' covers the extracted StyleX stylesheet at
    # /assets/stylex.css. No localhost origins are hardcoded here; connect-src
    # is left to the per-build meta CSP baked into index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Client-side routing: unknown paths fall back to the SPA entry document.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
