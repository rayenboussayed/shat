# SHAT local development stack.
#
# DinD forwards only host ports 31000-31099 to the host loopback, so the
# conventional 3000/5173 container ports are published as:
#   backend  -> 31001:3000
#   web      -> 31002:5173
#   dashboard-> 31003:5173
# Source is bind-mounted; an anonymous node_modules volume keeps the image's
# installed dependencies from being hidden by the mount. Values below are
# dev-only placeholders, never production secrets.

name: shat-dev

services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_USER: shat
      POSTGRES_PASSWORD: shat
      POSTGRES_DB: shat
    volumes:
      - shat-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shat -d shat"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: "${PORT:-3000}"
      DATABASE_URL: postgres://shat:shat@postgres:5432/shat
      CORS_ORIGINS: http://localhost:31002,http://localhost:31003
      SHAT_ENROLLMENT_TOKEN: dev-only-enrollment-token-not-a-secret
      SHAT_ENROLLMENT_USER_ID: 00000000-0000-4000-8000-000000000000
      TURN_SECRET: dev-only-turn-secret-with-more-than-32-chars
      TURN_URIS: turn:localhost:3478
      SHAT_ADMIN_TOKEN: dev-only-admin-token-with-more-than-32-chars
      EXPO_PUBLIC_API_BASE_URL: http://localhost:31001
    volumes:
      - ../..:/app
      - /app/node_modules
    ports:
      - "31001:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${PORT:-3000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:31001
    volumes:
      - ../..:/app
      - /app/node_modules
    ports:
      - "31002:5173"
    depends_on:
      backend:
        condition: service_healthy

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:31001
    volumes:
      - ../..:/app
      - /app/node_modules
    ports:
      - "31003:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  shat-postgres-dev: null
